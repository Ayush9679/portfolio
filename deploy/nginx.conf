##
# Nginx virtual host configuration for the Portfolio FastAPI backend.
# Install this to: /etc/nginx/sites-available/portfolio
# Then enable:     sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
# Then test:       sudo nginx -t
# Then reload:     sudo systemctl reload nginx
#
# For SSL, run:    sudo certbot --nginx -d api.YOUR_DOMAIN.com
##

server {
    listen 80;
    listen [::]:80;

    # Replace with your actual domain / subdomain (e.g., api.yourdomain.com)
    server_name api.YOUR_DOMAIN.com;

    # Security headers
    add_header X-Content-Type-Options    "nosniff"                          always;
    add_header X-Frame-Options           "DENY"                             always;
    add_header X-XSS-Protection          "1; mode=block"                    always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Client body size limit (protects against large POST payloads)
    client_max_body_size 1m;

    # Proxy all requests to the FastAPI/Gunicorn backend
    location / {
        proxy_pass          http://127.0.0.1:8000;
        proxy_http_version  1.1;

        # Required for WebSocket support (Uvicorn)
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";

        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        proxy_read_timeout    30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;

        # Disable buffering for streaming responses
        proxy_buffering off;
    }

    # Deny access to hidden files (e.g., .env, .git)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
